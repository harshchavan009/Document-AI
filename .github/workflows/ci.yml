name: DocuMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene:
    name: Repository Hygiene and Quality Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Hygiene and Zero Em Dash Rule
        run: |
          python3 scripts/verify_hygiene.py

  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          GOOGLE_API_KEY: "fake_gemini_api_key_for_ci_testing_only"
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: hygiene
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend ci

      - name: Build Frontend SPA
        run: |
          npm --prefix frontend run build
