services:
  documind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

